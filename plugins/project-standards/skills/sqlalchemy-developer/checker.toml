schema_version = 1
owner = "project-standards:sqlalchemy-developer"

[[check_list]]
id = "sqlalchemy.orm-model"
script_path = "scripts/orm_model_contract_check.py"
scope_strategy = "full-on-change"
path_include_glob_list = ["**/*.py", ".gitmodules"]
trigger_path_include_glob_list = ["**/*"]

[[check_list]]
id = "sqlalchemy.session-and-bootstrap"
script_path = "scripts/session_contract_check.py"
scope_strategy = "full-on-change"
path_include_glob_list = ["*", "**/*"]
trigger_path_include_glob_list = ["**/*"]

[[check_list]]
id = "sqlalchemy.model-package"
script_path = "scripts/model_package_contract_check.py"
scope_strategy = "full-on-change"
path_include_glob_list = ["model_sqlalchemy/**/*.py"]
trigger_path_include_glob_list = ["**/*"]

[[check_list]]
id = "sqlalchemy.standard-field-and-index"
script_path = "scripts/standard_field_contract_check.py"
scope_strategy = "full-on-change"
path_include_glob_list = ["backend/**/*.py", "lib/model_sqlalchemy/**/*.py", "model_sqlalchemy/**/*.py"]
trigger_path_include_glob_list = ["**/*"]
