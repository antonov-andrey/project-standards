[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27,<2"]

[project]
dependencies = [
    "black>=26.5.1,<27",
    "pathspec>=0.12.1,<2",
    "pytest>=9,<10",
]
description = "Development and test tooling for provider-owned project standards"
name = "project-standards"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
project-standard-check = "project_standards.project_standard_check:main"

[tool.hatch.build.targets.wheel]
packages = ["plugins/project-standards/lib/project_standards"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/project-standards/skills/python-cli-developer/checker.toml" = "project_standards/checker_assets/python-cli-developer/checker.toml"
"plugins/project-standards/skills/python-cli-developer/scripts" = "project_standards/checker_assets/python-cli-developer/scripts"

[tool.pytest.ini_options]
addopts = "-p project_standards.pytest_plugin"
pythonpath = ["plugins/project-standards/lib"]
